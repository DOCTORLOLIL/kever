<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/shabbat.js"></script>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תפילון – תהלים קי"ט</title>
<meta name="description" content="פסוקי תהלים קי&quot;ט לפי אותיות שם הנפטר ואותיות נשמה">
<meta name="theme-color" content="#1f5b57">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#f4f1ec;--card:#fffdf9;--ink:#23262b;--mute:#6d6a64;--line:#e2ddd4;--acc:#1f5b57;--acc2:#e9f1ef}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1e2226;--ink:#ece9e3;--mute:#a19d95;--line:#30353a;--acc:#5fb3aa;--acc2:#1f2d2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
h1,h2{font-family:"Frank Ruhl Libre",serif;margin:0}
h1{font-size:28px}
.lead{color:var(--mute);margin:4px 0 14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.form input,.form select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-width:0;width:100%}
.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:500;cursor:pointer;grid-column:1/-1}
.size{display:flex;gap:6px;justify-content:flex-end;margin:12px 0 0}
.size button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
#out{margin-top:16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sec h2{font-size:30px;color:var(--acc);display:flex;align-items:baseline;gap:10px}
.sec h2 small{font-family:Heebo;font-size:14px;color:var(--mute);font-weight:400}
.v{font-family:"Frank Ruhl Libre",serif;font-size:calc(21px * var(--z,1));line-height:1.8;margin:4px 0}
.v:first-letter{font-weight:700;color:var(--acc)}
.part{font-size:15px;color:var(--mute);margin:18px 2px 8px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:20px}
.note a{color:var(--mute)}
.err{color:#b3412f}
</style>
</head>
<body>
<div class="wrap">
  <h1>תפילון</h1>
  <p class="lead">פסוקי תהלים קי"ט לפי אותיות שם הנפטר, שם ההורה ואותיות נשמה.</p>
  <div class="form">
    <input id="name" placeholder="שם הנפטר" aria-label="שם הנפטר">
    <select id="rel" aria-label="בן או בת"><option>בן</option><option>בת</option></select>
    <input id="parent" placeholder="שם האם" aria-label="שם ההורה">
    <select id="ptype" aria-label="שם האם או שם האב" style="grid-column:1/-1"><option value="m">לפי שם האם</option><option value="f">לפי שם האב</option></select>
    <button class="btn" id="go">הצגת הפסוקים</button>
  </div>
  <div class="size"><button id="zm" aria-label="הקטנת טקסט">א-</button><button id="zp" aria-label="הגדלת טקסט">א+</button></div>
  <div id="out"></div>
  <p class="note">נוסח המקרא מתוך <a href="https://he.wikisource.org/wiki/תהלים_קיט/ניקוד" target="_blank" rel="noopener">ויקיטקסט – מקרא על פי המסורה</a> (CC BY-SA).</p>
</div>
<script>
const $=id=>document.getElementById(id);
const LET='אבגדהוזחטיכלמנסעפצקרשת', FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const SRC='https://he.wikisource.org/w/api.php?action=parse&page='+encodeURIComponent('תהלים קיט/ניקוד')+'&prop=text&format=json&origin=*';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
async function verses(){
  const cached=store.get('ps119',null); if(cached?.length===176)return cached;
  const j=await (await fetch(SRC)).json(); const d=document.createElement('div'); d.innerHTML=j.parse.text['*'];
  const re=/^\s*(?:קיט\s+)?([א-ת]{1,3})\s+(\S.*\.)\s*$/, vs=[];
  for(const l of d.innerText.split('\n')){const m=l.match(re);if(m)vs.push(m[2].trim())}
  if(vs.length!==176)throw new Error('parse');
  store.set('ps119',vs); return vs;
}
const letters=s=>[...(s||'').replace(/[֑-ׇ]/g,'')].map(c=>FIN[c]||c).filter(c=>LET.includes(c));
function section(vs,ch,label){const i=LET.indexOf(ch);
  return `<div class="sec"><h2>${ch}<small>${label}</small></h2>${vs.slice(i*8,i*8+8).map(v=>`<p class="v">${v}</p>`).join('')}</div>`}
async function render(){
  const n=$('name').value.trim(), p=$('parent').value.trim(); if(!n){$('name').focus();return}
  $('out').innerHTML='<p class="lead">טוען…</p>';
  let vs; try{vs=await verses()}catch{ $('out').innerHTML='<p class="err">לא הצלחנו לטעון את הפסוקים. בדקו את החיבור לאינטרנט ונסו שוב.</p>';return}
  let h=`<div class="part">${n} ${$('rel').value} ${p}</div>`;
  h+=letters(n).map(c=>section(vs,c,'שם הנפטר')).join('');
  if(p)h+=`<div class="part">${$('ptype').value==='m'?'שם האם':'שם האב'}</div>`+letters(p).map(c=>section(vs,c,$('ptype').value==='m'?'שם האם':'שם האב')).join('');
  h+='<div class="part">נשמה</div>'+['נ','ש','מ','ה'].map(c=>section(vs,c,'נשמה')).join('');
  $('out').innerHTML=h;
  const q=new URLSearchParams({n,r:$('rel').value,p,t:$('ptype').value}); history.replaceState(null,'','?'+q);
}
$('ptype').onchange=()=>{$('parent').placeholder=$('ptype').value==='m'?'שם האם':'שם האב'};
$('go').onclick=render;
let z=store.get('tz',1); document.documentElement.style.setProperty('--z',z);
$('zp').onclick=()=>{z=Math.min(1.8,z+0.1);document.documentElement.style.setProperty('--z',z);store.set('tz',z)};
$('zm').onclick=()=>{z=Math.max(0.7,z-0.1);document.documentElement.style.setProperty('--z',z);store.set('tz',z)};
// פתיחה עם פרטים מהקישור: ?n=שם&p=הורה&t=m|f&r=בן|בת
const sp=new URLSearchParams(location.search);
if(sp.get('n')){$('name').value=sp.get('n');$('parent').value=sp.get('p')||'';if(sp.get('t'))$('ptype').value=sp.get('t');if(sp.get('r'))$('rel').value=sp.get('r');$('ptype').onchange();render()}
</script>
</body>
</html>
