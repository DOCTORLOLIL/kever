<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/shabbat.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>מפת שכבות – בית העלמין אופקים</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}
#map{position:absolute;inset:0;background:#e9e6df}
.panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fffdf9;color:#23262b;border-radius:12px;box-shadow:0 2px 10px #0004;padding:10px 12px;width:230px;font-size:14px}
.panel h1{font-size:15px;margin:0 0 6px}
.lay{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;margin-top:6px}
.lay label{display:flex;gap:6px;align-items:center;font-weight:600}
.lay input[type=range]{width:100%;grid-column:1/-1;margin:0 0 4px}
.panel button{font:inherit;border:1px solid #d5cfc4;background:#f4f1ec;border-radius:8px;padding:5px 10px;margin-top:6px;cursor:pointer}
.plbl{background:none;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:13px;text-shadow:0 0 3px #000,0 0 3px #000}
@media (max-width:520px){.panel{width:170px;font-size:13px;padding:8px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>בית העלמין אופקים – שכבות</h1>
  <div class="lay">
    <label><input type="checkbox" id="cDrone" checked> תצלום רחפן</label><span></span>
    <input type="range" id="oDrone" min="0" max="100" value="100" aria-label="שקיפות תצלום הרחפן">
    <label><input type="checkbox" id="cPlan" checked> שרטוט התכנית</label><span></span>
    <input type="range" id="oPlan" min="0" max="100" value="75" aria-label="שקיפות השרטוט">
    <label><input type="checkbox" id="cPlots" checked> חלקות שסומנו בשטח</label><span></span>
  </div>
  <button id="fit">התאמה למסך</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const API='https://vqydrrhgklikhfdsgrwr.supabase.co/rest/v1/', KEY='sb_publishable_w6o5yCjbhBkuJ2FREujpHA_1V8ZcY0C';
// פינות השרטוט (שמאל-עליון, ימין-עליון, שמאל-תחתון) – חושבו מהתאמה ל-23 חלקות שסומנו ב-GPS
const PLAN={url:'/overlays/ofakim-plan.jpg',corners:[[31.3157124,34.6060619],[31.3165945,34.6104284],[31.3137639,34.6066517]]};
const DRONE={url:'/overlays/ofakim-2026.jpg',corners:[[31.3156051,34.6061477],[31.3165235,34.61048],[31.3135235,34.6067528]]};

const map=L.map('map',{zoomSnap:.25});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · תצלום ושרטוט: Grave Marker'}).addTo(map);
map.createPane('drone').style.zIndex=350; map.createPane('plan').style.zIndex=360;
const Ov=L.Layer.extend({
  initialize(o,pane,blend){this.url=o.url;this.c=o.corners.map(p=>L.latLng(p));this.paneName=pane;this.blend=blend},
  onAdd(m){this.img=L.DomUtil.create('img','leaflet-zoom-hide');this.img.src=this.url;
    this.img.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;max-width:none;'+(this.blend?'mix-blend-mode:multiply;':'');
    this.img.style.opacity=this.op??1;this.img.onload=()=>this.update();m.getPane(this.paneName).appendChild(this.img);m.on('zoomend viewreset moveend',this.update,this);this.update()},
  onRemove(m){this.img.remove();m.off('zoomend viewreset moveend',this.update,this)},
  setOpacity(v){this.op=v;if(this.img)this.img.style.opacity=v},
  update(){const im=this.img;if(!im||!im.naturalWidth||!this._map)return;const w=im.naturalWidth,h=im.naturalHeight;
    const [a,b,c]=this.c.map(x=>this._map.latLngToLayerPoint(x));im.style.width=w+'px';im.style.height=h+'px';
    im.style.transform=`matrix(${(b.x-a.x)/w},${(b.y-a.y)/w},${(c.x-a.x)/h},${(c.y-a.y)/h},${a.x},${a.y})`}
});
// "multiply" צריך לחול בתוך אותה שכבה, לכן השרטוט יושב באותו pane של הרחפן כשהרחפן מוצג
const drone=new Ov(DRONE,'drone',false).addTo(map), plan=new Ov(PLAN,'drone',true); plan.setOpacity(.75); plan.addTo(map);
const plots=L.layerGroup().addTo(map);
const all=[...PLAN.corners,...DRONE.corners,[31.3146,34.6110]];
const fit=()=>map.fitBounds(L.latLngBounds(all),{padding:[10,10]}); fit();

fetch(API+'plots?select=plot,boundary&cemetery_id=eq.ofakim&apikey='+KEY).then(r=>r.json()).then(rows=>{
  for(const p of rows){const ring=p.boundary?.coordinates?.[0]?.map(c=>[c[1],c[0]]);if(!ring)continue;
    const pg=L.polygon(ring,{color:'#DC1E1E',weight:2,fillOpacity:.05}).addTo(plots);
    L.marker(pg.getBounds().getCenter(),{interactive:false,icon:L.divIcon({className:'plbl',html:p.plot,iconSize:[40,16]})}).addTo(plots)}
}).catch(()=>{});

const tog=(cb,layer)=>$(cb).onchange=e=>e.target.checked?layer.addTo(map):map.removeLayer(layer);
tog('cDrone',drone);tog('cPlots',plots);
$('cPlan').onchange=e=>{if(e.target.checked){plan.addTo(map);plan.img&&map.getPane('drone').appendChild(plan.img)}else map.removeLayer(plan)};
$('oDrone').oninput=e=>drone.setOpacity(e.target.value/100);
$('oPlan').oninput=e=>plan.setOpacity(e.target.value/100);
$('fit').onclick=fit;
</script>
</body>
</html>
